[project]
name = "travel-planner-backend"
version = "0.1.0"
description = "Backend do Travel Planner — agente de planejamento de viagens com IA"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",
    "jinja2>=3.1.4",
    "markdown>=3.7",
    "weasyprint>=62.0",
    "python-slugify>=8.0.4",
    "tenacity>=9.0.0",
    "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "respx>=0.21.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # Depends(...) em default de argumento é o padrão idiomático do FastAPI
    "UP046", # Generic[T] em dataclass é compatível e mais simples que PEP 695 aqui
    "UP047", # idem, para funções genéricas
]

[tool.coverage.run]
source = ["app"]
